name: CI/CD - Linha 04

# ============================================================
# QUANDO o pipeline roda
# ============================================================
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # botão "Run workflow" na aba Actions

# ============================================================
# O QUE o pipeline pode fazer no repositório
# (sem estas 3 linhas o deploy no Pages falha)
# ============================================================
permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys disputando a mesma página
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  # ==========================================================
  # 1) BUILD — monta a pasta que vai para o ar
  # ==========================================================
  build:
    name: Build do site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Montar a pasta dist
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/
          echo "Arquivos copiados para dist/:"
          ls -la dist

      - name: Carimbar os dados desta execução na página
        run: |
          COMMIT_CURTO=$(echo "$GITHUB_SHA" | cut -c1-7)
          DATA=$(TZ=America/Sao_Paulo date '+%d/%m/%Y às %H:%M')

          sed -i "s/{{COMMIT}}/$COMMIT_CURTO/g" dist/index.html
          sed -i "s|{{BRANCH}}|$GITHUB_REF_NAME|g"   dist/index.html
          sed -i "s/{{RUN}}/$GITHUB_RUN_NUMBER/g"    dist/index.html
          sed -i "s|{{DATA}}|$DATA|g"                dist/index.html

          echo "Carimbado: commit $COMMIT_CURTO | execução #$GITHUB_RUN_NUMBER | $DATA"

      - name: Guardar o resultado do build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  # ==========================================================
  # 2) TEST — só roda se o build passou (needs: build)
  # ==========================================================
  test:
    name: Verificações automáticas
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Recuperar o resultado do build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Os arquivos obrigatórios existem?
        run: |
          for arquivo in index.html style.css script.js; do
            if [ ! -f "dist/$arquivo" ]; then
              echo "::error::arquivo ausente na pasta publicada: $arquivo"
              exit 1
            fi
          done
          echo "OK - index.html, style.css e script.js presentes"

      - name: Os marcadores do build foram substituídos?
        run: |
          sobras=$(grep -o "{{[A-Z_]*}}" dist/index.html || true)
          if [ -n "$sobras" ]; then
            echo "::error::sobrou marcador não substituído: $sobras"
            exit 1
          fi
          echo "OK - nenhum marcador pendente"

      - name: O HTML segue o básico de boas práticas?
        run: |
          grep -q 'lang="pt-BR"' dist/index.html || { echo "::error::falta lang=\"pt-BR\" na tag <html>"; exit 1; }
          grep -q '<title>.\+</title>' dist/index.html || { echo "::error::a página está sem <title>"; exit 1; }
          grep -q 'name="viewport"' dist/index.html || { echo "::error::falta a meta viewport - o site quebra no celular"; exit 1; }
          echo "OK - idioma, título e viewport presentes"

      - name: Os arquivos CSS e JS citados existem mesmo?
        run: |
          referencias=$(grep -oE '(href|src)="[^"]+\.(css|js)"' dist/index.html | cut -d'"' -f2)
          for ref in $referencias; do
            if [ ! -f "dist/$ref" ]; then
              echo "::error::o HTML aponta para um arquivo que não existe: $ref"
              exit 1
            fi
            echo "  encontrado: $ref"
          done
          echo "OK - todas as referências resolvem"

      - name: Toda imagem tem texto alternativo?
        run: |
          sem_alt=$(grep -o "<img[^>]*>" dist/index.html | grep -v "alt=" || true)
          if [ -n "$sem_alt" ]; then
            echo "::error::imagem sem atributo alt (acessibilidade):"
            echo "$sem_alt"
            exit 1
          fi
          echo "OK - nenhuma imagem sem alt"

  # ==========================================================
  # 3) DEPLOY — só roda se os testes passaram (needs: test)
  #    e só em push na main (pull request não publica)
  # ==========================================================
  deploy:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Recuperar o resultado do build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
